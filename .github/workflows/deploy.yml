name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install image tools
        # pillow-heif lets build.py turn iPhone .heic uploads into .jpg, which
        # every browser can display. Optional by design: if the install fails,
        # build.py leaves HEIC files alone rather than failing the deploy.
        run: pip install pillow pillow-heif || true

      - name: Ensure ffmpeg is available
        # build.py re-encodes phone video to 720p H.264 in an .mp4. ffmpeg ships
        # on the runner image, so this usually prints a version and moves on;
        # the install is only a fallback. Failure is tolerated — build.py leaves
        # videos untouched when ffmpeg is missing.
        run: ffmpeg -version >/dev/null 2>&1 || sudo apt-get install -y ffmpeg || true

      - name: Regenerate gallery.json from media/
        run: python3 build.py

      - name: Validate JSON files
        run: |
          python3 -c "import json; [json.load(open(p)) for p in ['data/athletes.json','data/content.json','data/gallery.json']]; print('JSON OK')"

      - name: Commit refreshed gallery.json and converted media (if changed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # media/ is included because build.py may have replaced a .heic
          # upload with a .jpg; that conversion has to be committed or it
          # would be redone on every deploy.
          if git diff --quiet -- data/gallery.json media/ calendar/; then
            echo "gallery.json, media, and calendar feeds unchanged"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/gallery.json media/ calendar/
            git commit -m "chore: refresh gallery.json and calendar feeds"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
